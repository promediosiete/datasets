name: Normalizar CSV

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalizar_csv.yml"

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar pandas
        run: python -m pip install --quiet pandas

      - name: Normalizar datasets
        shell: bash
        run: |
          cat > /tmp/normalizar.py <<'PY'
          from pathlib import Path
          import pandas as pd
          import unicodedata
          import re

          FILES = [
              "viveros_registrados.csv",
              "semilleros_ogm_2015_2016.csv",
              "dengue_zika_2022.csv",
              "nacidos_vivos_2024.csv",
              "defunciones_2024.csv",
          ]

          def snake(text):
              text = str(text).strip()
              text = unicodedata.normalize("NFKD", text)
              text = "".join(ch for ch in text if not unicodedata.combining(ch))
              text = text.replace("º", "o").replace("°", "o")
              text = re.sub(r"[^A-Za-z0-9]+", "_", text)
              text = re.sub(r"_+", "_", text).strip("_").lower()
              return text or "columna"

          def trim_text(df):
              for col in df.select_dtypes(include=["object", "string"]).columns:
                  df[col] = df[col].map(lambda x: x.strip() if isinstance(x, str) else x)
              return df

          def save(df, path):
              df = trim_text(df)
              df = df.dropna(how="all")
              df.to_csv(path, index=False, encoding="utf-8", lineterminator="\n")

          # 1) Viveros SAG: elimina portada/simbologia y usa un encabezado único.
          viveros_cols = [
              "region",
              "vivero_frutales",
              "vivero_forestales",
              "vivero_ornamentales",
              "vivero_vides",
              "codigo_inscripcion_vivero",
              "fecha_inscripcion",
              "nombre_fantasia_vivero",
              "nombre_propietario",
              "apellido_paterno",
              "apellido_materno",
              "sexo_tipo_propietario",
              "especie_1",
              "especie_2",
              "especie_3",
              "actividad_comercial",
              "direccion_predio_calle",
              "huso",
              "coordenada_este",
              "coordenada_norte",
              "provincia",
              "comuna",
              "zona_urbana_rural",
              "oficina_sag",
              "superficie_vivero_ha",
              "fono_comercial",
              "direccion_postal",
              "correo_electronico",
              "fax",
          ]
          v = pd.read_csv(
              "viveros_registrados.csv",
              sep=";",
              skiprows=15,
              header=None,
              names=viveros_cols,
              dtype=str,
              keep_default_na=False,
              encoding="utf-8",
          )
          v = v.loc[~v.apply(lambda row: all(str(x).strip() == "" for x in row), axis=1)].copy()
          for col in ["huso", "coordenada_este", "coordenada_norte"]:
              v[col] = pd.to_numeric(v[col].replace("", pd.NA), errors="coerce")
          v["superficie_vivero_ha"] = pd.to_numeric(
              v["superficie_vivero_ha"].str.replace(",", ".", regex=False).replace("", pd.NA),
              errors="coerce",
          )
          save(v, "viveros_registrados.csv")

          # 2) Semilleros SAG: elimina títulos previos y la fila resumen Total.
          s = pd.read_csv(
              "semilleros_ogm_2015_2016.csv",
              sep=";",
              skiprows=7,
              dtype=str,
              keep_default_na=False,
              encoding="utf-8",
          )
          s.columns = [
              "sub_tipo",
              "region",
              "comuna",
              "oficina_sag",
              "localidad",
              "especie",
              "numero_potreros",
              "superficie_inscrita",
          ]
          s = s[s["sub_tipo"].str.strip().str.casefold() != "total"].copy()
          s = s.loc[~s.apply(lambda row: all(str(x).strip() == "" for x in row), axis=1)].copy()
          s["numero_potreros"] = pd.to_numeric(s["numero_potreros"].replace("", pd.NA), errors="coerce")
          s["superficie_inscrita"] = pd.to_numeric(
              s["superficie_inscrita"].str.replace(",", ".", regex=False).replace("", pd.NA),
              errors="coerce",
          )
          save(s, "semilleros_ogm_2015_2016.csv")

          # 3) Dengue/Zika: conserva todos los registros y estandariza nombres/tipos.
          d = pd.read_csv("dengue_zika_2022.csv", sep=";", encoding="utf-8")
          d.columns = [snake(c) for c in d.columns]
          for col in ["departamento_id", "provincia_id", "ano", "semanas_epidemiologicas", "grupo_edad_id", "cantidad_casos"]:
              if col in d.columns:
                  d[col] = pd.to_numeric(d[col], errors="raise")
          save(d, "dengue_zika_2022.csv")

          # 4) Estadísticas vitales: conserva el contenido y normaliza encabezados.
          for path in ["nacidos_vivos_2024.csv", "defunciones_2024.csv"]:
              df = pd.read_csv(path, sep=";", encoding="utf-8")
              df.columns = [snake(c) for c in df.columns]
              save(df, path)

          # Validación estricta: todos deben abrirse con pd.read_csv sin argumentos extra.
          print("\nVALIDACION FINAL")
          for path in FILES:
              raw = Path(path).read_bytes()
              raw.decode("utf-8", errors="strict")
              df = pd.read_csv(path)
              assert len(df.columns) == len(set(df.columns)), f"Columnas duplicadas en {path}"
              assert all(str(c).strip() and not str(c).lower().startswith("unnamed") for c in df.columns), f"Encabezado invalido en {path}"
              assert not df.dropna(how="all").empty, f"Dataset vacio: {path}"
              assert len(df) == len(df.dropna(how="all")), f"Filas vacias en {path}"
              print(f"{path}: OK | {len(df)} filas x {len(df.columns)} columnas")

          # Comprobaciones específicas de los dos archivos que tenían estructura problemática.
          vs = pd.read_csv("viveros_registrados.csv")
          ss = pd.read_csv("semilleros_ogm_2015_2016.csv")
          assert list(vs.columns) == viveros_cols
          assert not ss["sub_tipo"].astype(str).str.casefold().eq("total").any()
          print("Todos los CSV son UTF-8 y se leen con pd.read_csv('archivo.csv').")
          PY
          python /tmp/normalizar.py

      - name: Commit de CSV normalizados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viveros_registrados.csv semilleros_ogm_2015_2016.csv dengue_zika_2022.csv nacidos_vivos_2024.csv defunciones_2024.csv
          git rm .github/workflows/normalizar_csv.yml
          git commit -m "data: normaliza datasets CSV para pandas"
          git push origin HEAD:main
